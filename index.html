<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Fullscreen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        #videoContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* The invisible click trigger */
        #clickTrigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            cursor: pointer;
            background-color: transparent;
        }
    </style>
</head>
<body>

    <div id="videoContainer">
        <!-- THE VIDEO -->
        <video id="myVideo" autoplay muted loop playsinline>
            <source src="https://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4">
        </video>
    </div>

    <!-- INVISIBLE CLICK TRIGGER -->
    <!-- This invisible box handles the clicks for all browsers -->
    <div id="clickTrigger" onclick="triggerFullscreen()"></div>

    <script>
        // 1. Universal Fullscreen Function
        // Covers Chrome, Firefox, Safari, Edge, and IE11
        function triggerFullscreen() {
            const elem = document.documentElement; // The whole page

            // Try the standard method first
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => console.log(err));
            } 
            // Try Safari/WebKit method
            else if (elem.webkitRequestFullscreen) { 
                elem.webkitRequestFullscreen();
            } 
            // Try IE11 method
            else if (elem.msRequestFullscreen) { 
                elem.msRequestFullscreen();
            }
        }

        // 2. Logic to run on Instant Visit
        window.onload = function() {
            const trigger = document.getElementById('clickTrigger');

            // Force 1: Immediate Trigger
            trigger.click();

            // Force 2: 100ms Delay (Required for Chrome/Edge strict policies)
            setTimeout(function() {
                trigger.click();
            }, 100);
        };
    </script>

</body>
</html>
