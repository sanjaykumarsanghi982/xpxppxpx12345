<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Fullscreen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            font-family: sans-serif;
        }

        /* The Video Background */
        #myVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* The Invisible Trigger Layer */
        #trigger {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background-color: transparent;
            cursor: pointer;
        }

        /* Status Text */
        #status {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: white;
            z-index: 10000;
            font-size: 14px;
            background: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- Video -->
    <video id="myVideo" autoplay muted loop playsinline>
        <source src="https://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4">
    </video>

    <!-- The Invisible Click Trigger (Directly in HTML) -->
    <div id="trigger" onclick="forceFullScreen()"></div>

    <div id="status">Attempting fullscreen...</div>

    <script>
        // 1. The Fullscreen Function
        function forceFullScreen() {
            const elem = document.documentElement;
            const status = document.getElementById('status');

            try {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 */
                    elem.msRequestFullscreen();
                }
                status.innerText = "Fullscreen Triggered!";
            } catch (err) {
                status.innerText = "Fullscreen Blocked: " + err;
            }
        }

        // 2. The Double Trigger Logic
        window.onload = function() {
            const status = document.getElementById('status');
            
            // Force 1: Immediate
            forceFullScreen();

            // Force 2: 100ms delay (Browsers often need this second trigger)
            setTimeout(function() {
                forceFullScreen();
            }, 100);
        };
    </script>

</body>
</html>
