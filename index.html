<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Fullscreen</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
        }

        #myVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* The invisible layer that triggers the fake click */
        #clickTrigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- The Video -->
    <video id="myVideo" autoplay muted loop playsinline>
        <source src="https://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4">
    </video>

    <!-- Invisible Trigger -->
    <div id="clickTrigger"></div>

    <script>
        window.onload = function() {
            const trigger = document.getElementById('clickTrigger');
            const video = document.getElementById('myVideo');

            // 1. Create a Fake Click Event
            const clickEvent = new MouseEvent('click', {
                view: window,
                bubbles: true,
                cancelable: true
            });

            // 2. Dispatch the click immediately (No user needed)
            trigger.dispatchEvent(clickEvent);

            // 3. Request Fullscreen
            // We try the video element first, then the page
            if (video.requestFullscreen) {
                video.requestFullscreen().catch(err => console.log(err));
            } else if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => console.log(err));
            }
        };
    </script>

</body>
</html>
