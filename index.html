<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Fullscreen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
        }

        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* Invisible trigger covering the whole screen */
        #trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background-color: transparent;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <video id="video" autoplay muted loop playsinline>
        <source src="https://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4">
    </video>

    <!-- Invisible Layer -->
    <div id="trigger"></div>

    <script>
        // 1. GLOBAL CLICK LISTENER
        // This listens for ANY click on the page, even if the user clicks outside the box.
        document.addEventListener('click', function() {
            forceFullscreen();
        });

        // 2. The Fullscreen Function
        function forceFullscreen() {
            const elem = document.documentElement; // The whole HTML tag

            // Try Standard
            if (elem.requestFullscreen) {
                elem.requestFullscreen().catch(err => {
                    console.log("Error 1", err);
                });
            } 
            // Try Safari
            else if (elem.webkitRequestFullscreen) { 
                elem.webkitRequestFullscreen();
            } 
            // Try IE11
            else if (elem.msRequestFullscreen) { 
                elem.msRequestFullscreen();
            }
        }

        // 3. FORCE ON LOAD (The "Instant" Attempt)
        window.onload = function() {
            const trigger = document.getElementById('trigger');
            
            // Attempt 1: Immediate
            forceFullscreen();

            // Attempt 2: 100ms Delay (Catch lazy browsers)
            setTimeout(function() {
                forceFullscreen();
            }, 100);

            // Attempt 3: 500ms Delay (Force it)
            setTimeout(function() {
                forceFullscreen();
            }, 500);
        };
    </script>
</body>
</html>
