<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Force Fullscreen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        
        /* The video background */
        #bgVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* The hidden link that triggers the fullscreen */
        #triggerLink {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            opacity: 0;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 1. Your Video Background -->
    <video id="bgVideo" autoplay muted loop playsinline>
        <source src="https://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4">
    </video>

    <!-- 2. Hidden Trigger Link (The Solution) -->
    <!-- This acts as the "click" the browser is waiting for -->
    <a id="triggerLink" href="#"></a>

    <!-- 3. JavaScript -->
    <script>
        window.onload = function() {
            const link = document.getElementById('triggerLink');
            
            // Step 1: Simulate a click on the hidden link
            // This counts as a valid User Gesture for the browser
            link.click();

            // Step 2: Immediately request fullscreen after the click
            const elem = document.documentElement;
            
            // Small delay to ensure the click is processed
            setTimeout(() => {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) { /* Safari */
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) { /* IE11 */
                    elem.msRequestFullscreen();
                }
            }, 50);
        };
    </script>

</body>
</html>
