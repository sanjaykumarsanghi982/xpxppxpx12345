<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Force Fullscreen</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
        }

        /* The big button */
        #fsButton {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 40px 80px;
            font-size: 24px;
            background-color: #ff0000;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        #fsButton:hover {
            background-color: #cc0000;
        }

        /* The video background */
        #bgVideo {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
    </style>
</head>
<body>

    <!-- Video Background -->
    <video id="bgVideo" autoplay muted loop playsinline>
        <source src="https://media.w3.org/2010/05/sintel/trailer.mp4" type="video/mp4">
    </video>

    <!-- The Button -->
    <button id="fsButton">CLICK HERE TO FULLSCREEN</button>

    <script>
        // 1. Function to force fullscreen
        function forceFullscreen() {
            const elem = document.documentElement;
            if (elem.requestFullscreen) {
                elem.requestFullscreen();
            } else if (elem.webkitRequestFullscreen) { /* Safari */
                elem.webkitRequestFullscreen();
            } else if (elem.msRequestFullscreen) { /* IE11 */
                elem.msRequestFullscreen();
            }
        }

        // 2. Trigger the button click automatically after 1 second
        window.onload = function() {
            setTimeout(function() {
                const btn = document.getElementById('fsButton');
                btn.click(); // The browser sees this as a real user click
                btn.style.display = 'none'; // Hide the button once clicked
            }, 1000);
        };
    </script>

</body>
</html>
